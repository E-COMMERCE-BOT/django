[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-django-api"
version = "1.0.0"
description = "Django REST backend for a Telegram e-commerce bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=2.3,<3",
    "django>=5.2,<6",
    "djangorestframework>=3.16,<4",
    "pillow>=11,<12",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["ecommerce", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ecommerce.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
